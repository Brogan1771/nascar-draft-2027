<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NASCAR 2027 50-Team Draft Manager</title>
    <style>
        :root {
            --primary: #0A2342;
            --secondary: #1D3557;
            --accent-green: #2A9D8F;
            --accent-yellow: #E9C46A;
            --light-bg: #F8F9FA;
            --border-color: #BDC3C7;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: var(--light-bg);
            margin: 0;
            padding: 20px;
            color: #333;
        }
        h1 {
            color: var(--primary);
            text-align: center;
            font-size: 28px;
            margin-bottom: 25px;
            text-transform: uppercase;
            border-bottom: 4px solid var(--primary);
            padding-bottom: 10px;
        }
        .tabs {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
        }
        .tab-btn {
            background-color: #E2E8F0;
            border: 2px solid var(--border-color);
            color: #4A5568;
            padding: 14px 28px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 8px;
        }
        .tab-btn.active {
            background-color: var(--primary);
            color: white;
            border-color: var(--primary);
            box-shadow: 0 4px 6px rgba(0,0,0,0.15);
        }
        .tab-content {
            display: none;
            background: white;
            padding: 25px;
            border-radius: 12px;
            border: 2px solid var(--border-color);
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            max-width: 1400px;
            margin: 0 auto;
        }
        .tab-content.active {
            display: block;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 16px;
        }
        th {
            background-color: var(--primary);
            color: white;
            padding: 16px;
            text-align: left;
        }
        td {
            padding: 16px;
            border-bottom: 1px solid #E2E8F0;
        }
        .team-barrier-row td {
            border-top: 5px solid var(--primary) !important;
            background-color: #EDF2F7;
            font-weight: bold;
            color: var(--primary);
        }
        .status-active {
            background-color: rgba(42, 157, 143, 0.15);
            color: #1B655C;
            font-weight: bold;
        }
        .status-bench {
            background-color: rgba(233, 196, 106, 0.15);
            color: #8F6B00;
        }
        select, input {
            font-size: 15px;
            padding: 8px;
            border-radius: 6px;
            border: 2px solid var(--border-color);
            font-weight: bold;
        }
        .week-selector-container {
            background-color: #EDF2F7;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 18px;
            font-weight: bold;
        }
        .zebra-row:nth-child(even) {
            background-color: #F8F9FA;
        }
    </style>
</head>
<body>

    <h1>🏆 NASCAR 2027 Cup Series Draft Dashboard</h1>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('leaderboard')">🏆 Standings Leaderboard</button>
        <button class="tab-btn" onclick="switchTab('rosters')">📋 Team Rosters (50 Teams)</button>
        <button class="tab-btn" onclick="switchTab('schedule')">🏁 36-Race Points Input</button>
    </div>

    <!-- TAB 1: LEADERBOARD -->
    <div id="leaderboard" class="tab-content active">
        <div class="week-selector-container">
            <label for="currentWeekSelect">🔎 View Stats For Race Week: </label>
            <select id="currentWeekSelect" onchange="calculateApp()"></select>
        </div>
        <table>
            <thead>
                <tr>
                    <th>Rank</th>
                    <th>Team Name</th>
                    <th>Points This Week</th>
                    <th>Total Points</th>
                    <th>Points Behind Leader</th>
                </tr>
            </thead>
            <tbody id="leaderboard-data"></tbody>
        </table>
    </div>

    <!-- TAB 2: ROSTERS -->
    <div id="rosters" class="tab-content">
        <table>
            <thead>
                <tr>
                    <th>Team Name</th>
                    <th>Roster Slot</th>
                    <th>Driver Selection</th>
                    <th>Roster Status</th>
                    <th>Weeks Active</th>
                    <th>12-Race Min?</th>
                </tr>
            </thead>
            <tbody id="rosters-data"></tbody>
        </table>
    </div>

    <!-- TAB 3: SCHEDULE -->
    <div id="schedule" class="tab-content">
        <p style="color: #C53030; font-weight: bold;">⚠️ Enter raw point scores for each driver below on race days. All views recalculate automatically.</p>
        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr id="schedule-header">
                        <th style="position: sticky; left: 0; background-color: var(--primary);">Driver Name</th>
                    </tr>
                </thead>
                <tbody id="schedule-data"></tbody>
            </table>
        </div>
    </div>

    <script>
        const RACES = [
            "Daytona 500", "Atlanta", "Austin (COTA)", "Phoenix", "Las Vegas", "Darlington", 
            "Bristol", "Martinsville", "Talladega", "Texas", "Kansas", "Dover", 
            "Charlotte (600)", "Nashville", "Pocono", "Michigan", "Chicagoland", "Iowa", 
            "Sonoma", "Atlanta 2", "Indianapolis", "Bristol Night", "St. Louis", "Daytona 2", 
            "Darlington 2", "Richmond", "Watkins Glen", "New Hampshire", "Kansas 2", "Las Vegas 2", 
            "Charlotte Roval", "Phoenix 2", "Talladega 2", "Martinsville 2", "Homestead-Miami", "Championship"
        ];

        const DRIVERS = [
            "Kyle Larson", "Chase Elliott", "William Byron", "Alex Bowman", "Denny Hamlin",
            "Christopher Bell", "Ty Gibbs", "Chase Briscoe", "Joey Logano", "Ryan Blaney",
            "Austin Cindric", "Chris Buescher", "Brad Keselowski", "Ryan Preece", "Tyler Reddick",
            "Bubba Wallace", "Corey Heim", "Josh Berry", "Erik Jones", "Riley Herbst",
            "Kyle Busch", "Austin Dillon", "Austin Hill", "Michael McDowell", "Carson Hocevar",
            "Zane Smith", "Cole Custer", "Jesse Love", "Noah Gragson", "Todd Gilliland",
            "Justin Haley", "Christian Eckes", "Taylor Gray", "AJ Allmendinger", "Daniel Suarez"
        ].sort();

        let db = { teams: [], points: {}, activeHistory: {} };

        function initData() {
            DRIVERS.forEach(d => { db.points[d] = Array(36).fill(0); });
            for (let t = 1; t <= 50; t++) {
                let team = { name: `Fantasy Team ${t}`, roster: [] };
                for (let s = 0; s < 9; s++) {
                    team.roster.push({ driver: DRIVERS[s % DRIVERS.length], status: s < 6 ? "Active" : "Bench" });
                    db.activeHistory[`${t-1}-${s}`] = Array(36).fill(s < 6);
                }
                db.teams.push(team);
            }
        }

        function switchTab(id) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        function calculateApp() {
            const currentWeekIdx = parseInt(document.getElementById('currentWeekSelect').value || 0);
            let teamScores = db.teams.map((team, tIdx) => {
                let totalPoints = 0; let currentWeekPoints = 0;
                team.roster.forEach((slot, sIdx) => {
                    let dPoints = db.points[slot.driver] || Array(36).fill(0);
                    for (let w = 0; w < 36; w++) {
                        if (db.activeHistory[`${tIdx}-${sIdx}`][w]) {
                            totalPoints += dPoints[w];
                            if (w === currentWeekIdx) currentWeekPoints += dPoints[w];
                        }
                    }
                });
                return { name: team.name, total: totalPoints, weekly: currentWeekPoints };
            });

            teamScores.sort((a, b) => b.total - a.total);
            const maxScore = teamScores.length > 0 ? teamScores[0].total : 0;

            let lbBody = document.getElementById('leaderboard-data');
            if (lbBody) {
                lbBody.innerHTML = '';
                teamScores.forEach((t, index) => {
                    let gapDisplay = (t.total === maxScore) ? "—" : `-${maxScore - t.total}`;
                    let row = document.createElement('tr');
                    row.className = "zebra-row";
                    row.innerHTML = `<td>${index + 1}</td><td style="font-weight:bold;">${t.name}</td><td>+${t.weekly}</td><td style="font-weight:bold;">${t.total}</td><td style="color:#C53030; font-weight:bold;">${gapDisplay}</td>`;
                    lbBody.appendChild(row);
                });
            }
        }

        function renderRosters() {
            let rBody = document.getElementById('rosters-data');
            if (!rBody) return;
            rBody.innerHTML = '';
            db.teams.forEach((team, tIdx) => {
                team.roster.forEach((slot, sIdx) => {
                    let row = document.createElement('tr');
                    if (sIdx === 0) row.className = "team-barrier-row";
